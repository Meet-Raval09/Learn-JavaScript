<!Doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta http-equiv='X-UA-Compatible' content='IE=edge'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<link rel='stylesheet' href='' type='text/css'>
<title>React</title>
</head>
<body>
<button>Click Me!!</button>
<script>
 class React{
  constructor(){
    this.server = "http://localhost:8000";
    this.package = "React-Native-Main v5.10.5";

    document
    .querySelector("button")
    .addEventListener("click",this.TheHandlerClick.bind(this))

  }
  TheHandlerClick(){
   alert("The Button Has Been Clicked");
   console.log(`The Package Used Is: ${this.package} And The Server Is: ${this.server}!!.`);
  }
 }
 const MyApp = new React();
</script>
</body>
</html>
