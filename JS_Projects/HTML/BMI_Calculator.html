<!Doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta http-equiv='X-UA-Compatible' content='IE=edge'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<link rel='stylesheet' href='/CSS/BMI_Calculator.css' type='text/css'>
<title>BMI Calculator</title>
</head>
<body>
<div class="main-div">
 <h1>BMI Calculator.</h1>
 <div class="msg-box">Your BMI Result!</div>
 <form>
  <label>Height In CM</label><input type="text" class="height">
  <label>Weight In KG</label><input type="text" class="weight">
  <button id="btn-one">Calculate</button>

  <h3>BMI Weight Guide</h3>
  <span>Under Weight : Less Then 18.6</span>
  <span>Normal Range : 18.6 Then 24.9</span>
  <span>Over Weight : Greater Then 24.9</span>
 </form>
</div>
<script src='/JS/BMI_Calculator.js'></script>
</body>
</html>
